<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود | Xray Panel</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <div class="logo">
            X
        </div>

        <h1>Xray Panel</h1>

        <p class="subtitle">
            ورود به پنل مدیریت
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <div class="input-group">
                <label>نام کاربری</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required
                >
            </div>

            <div class="input-group">
                <label>رمز عبور</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >
            </div>

            <button type="submit">
                ورود
            </button>

        </form>

    </div>

</div>

</body>
</html>
